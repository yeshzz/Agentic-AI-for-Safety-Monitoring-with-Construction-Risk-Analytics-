<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BuildSure AI — Site Risk Dashboard</title>
<style>
  :root {
    --navy: #1c2b4a; --orange: #e8792c; --red: #d0453a;
    --green: #2e9e5b; --gray-bg: #f4f6f9; --card-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--gray-bg); margin: 0; padding: 24px; color: #1c2b4a;
  }
  header {
    background: var(--navy); color: white; padding: 20px 28px;
    border-radius: 10px; display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 20px;
  }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; opacity: 0.75; font-size: 13px; }
  .live-badge {
    background: var(--red); padding: 5px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
  }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  .card {
    background: var(--card-bg); border-radius: 10px; padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; color: var(--navy); }
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .kpi { background: var(--gray-bg); border-radius: 8px; padding: 14px; }
  .kpi .label { font-size: 12px; color: #666; }
  .kpi .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .kpi.warn .value { color: var(--orange); }
  .kpi.danger .value { color: var(--red); }
  .kpi.ok .value { color: var(--green); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; }
  th { color: #888; font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .sev-badge {
    padding: 2px 9px; border-radius: 12px; font-size: 11px; font-weight: 600; color: white;
  }
  .zone-bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13px;}
  .zone-bar-bg { flex:1; background:#eee; border-radius:6px; height:10px; overflow:hidden; }
  .zone-bar-fill { height:100%; background: var(--orange); border-radius:6px; }
  .loading { text-align:center; padding: 60px; color:#888; }
</style>
</head>
<body>

<header>
  <div>
    <h1>⚠️ BuildSure AI — Site Risk Monitoring Dashboard</h1>
    <p>Milestone 1: Site Risk Agent · Hazard Detection · Risk Scoring</p>
  </div>
  <div class="live-badge" id="liveBadge">● LIVE MONITORING</div>
</header>

<div id="content" class="loading">Loading site risk data…</div>

<script>
async function loadDashboard() {
  const res = await fetch('/api/site-risk');
  const data = await res.json();

  const zoneEntries = Object.entries(data.zone_hazard_counts);
  const maxZoneCount = Math.max(1, ...zoneEntries.map(([,c]) => c));

  const sevColor = s => s >= 8 ? '#d0453a' : s >= 6 ? '#e8792c' : '#c9a227';

  const html = `
    <div class="grid">
      <div>
        <div class="card">
          <h2>📊 Key Performance Indicators</h2>
          <div class="kpi-grid">
            <div class="kpi ${data.site_risk_score >= 70 ? 'danger' : data.site_risk_score >= 40 ? 'warn' : 'ok'}">
              <div class="label">Site Risk Score</div>
              <div class="value">${data.site_risk_score}/100</div>
            </div>
            <div class="kpi warn">
              <div class="label">Active Hazards</div>
              <div class="value">${data.active_hazards}</div>
            </div>
            <div class="kpi danger">
              <div class="label">High-Risk Zones</div>
              <div class="value">${data.high_risk_zones.length}</div>
            </div>
            <div class="kpi ok">
              <div class="label">Equipment Flags</div>
              <div class="value">${data.equipment_hazards.length}</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>🚨 Hazard Detection Panel</h2>
          <table>
            <tr><th>Zone</th><th>Hazard Type</th><th>Severity</th></tr>
            ${data.hazards_detected.map(h => `
              <tr>
                <td>${h.zone}</td>
                <td>${h.hazard_type}</td>
                <td><span class="sev-badge" style="background:${sevColor(h.severity)}">${h.severity}/10</span></td>
              </tr>
            `).join('')}
          </table>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>🗺️ Risk Distribution by Zone</h2>
          ${zoneEntries.map(([zone, count]) => `
            <div class="zone-bar-row">
              <div style="width:150px">${zone}</div>
              <div class="zone-bar-bg"><div class="zone-bar-fill" style="width:${(count/maxZoneCount*100)}%"></div></div>
              <div>${count}</div>
            </div>
          `).join('') || '<p style="color:#888">No zone hazards detected in this cycle.</p>'}
        </div>

        <div class="card">
          <h2>🌦️ Environmental Risk</h2>
          <p style="font-size:13px;">Flagged events: <b>${data.environmental_risk.flagged_events}</b></p>
          <p style="font-size:13px;">Conditions: ${data.environmental_risk.conditions.join(', ') || 'None'}</p>
        </div>

        <div class="card">
          <h2>🔧 Equipment Hazards</h2>
          ${data.equipment_hazards.map(e => `
            <p style="font-size:13px; margin:6px 0;"><b>${e.equipment}</b> (${e.zone})<br>
            <span style="color:#d0453a">${e.issues.join(' · ')}</span></p>
          `).join('') || '<p style="color:#888;font-size:13px;">All equipment operational.</p>'}
        </div>
      </div>
    </div>
    <p style="text-align:center;color:#999;font-size:12px;">Last updated: ${new Date(data.generated_at).toLocaleString()}</p>
  `;

  document.getElementById('content').className = '';
  document.getElementById('content').innerHTML = html;
}

loadDashboard();
setInterval(loadDashboard, 15000); // refresh every 15s to simulate "live monitoring"
</script>

</body>
</html>
